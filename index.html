<title>TT Tile Link · Teddy &amp; Tommy</title>
<!-- The game's icon: the same emoji as its card on the dashboard, on a coloured tile. It's the browser tab's icon (the SVG, then
     a PNG drawn below) and the iPad home screen's (apple-touch-icon). The device's own emoji font draws it: no image files. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20x='2'%20y='2'%20width='60'%20height='60'%20rx='14'%20fill='%231f9a6a'%20stroke='%2314121f'%20stroke-width='4'/%3E%3Ctext%20x='32'%20y='44'%20font-size='36'%20text-anchor='middle'%3E%F0%9F%80%84%3C/text%3E%3C/svg%3E">
<script>
  (function (emoji, tile) {
    function draw(size, framed) {
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const g = c.getContext('2d');
      if (!g) return '';
      const u = size / 64;
      g.fillStyle = tile;
      if (framed) { // the tab: a rounded tile with the dashboard's dark outline
        g.beginPath();
        if (g.roundRect) g.roundRect(2 * u, 2 * u, 60 * u, 60 * u, 14 * u); else g.rect(2 * u, 2 * u, 60 * u, 60 * u);
        g.fill();
        g.lineWidth = 4 * u;
        g.strokeStyle = '#14121f';
        g.stroke();
      } else g.fillRect(0, 0, size, size); // the home screen: iOS rounds the corners itself
      g.font = `${Math.round(size * (framed ? 0.56 : 0.62))}px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif`;
      g.textAlign = 'center';
      const m = g.measureText(emoji);
      const up = m.actualBoundingBoxAscent || size * 0.4, down = m.actualBoundingBoxDescent || 0;
      g.fillText(emoji, size / 2, size / 2 + (up - down) / 2);
      try { return c.toDataURL('image/png'); } catch (e) { return ''; }
    }
    const tab = draw(64, true), home = draw(180, false);
    if (tab) document.querySelector('link[rel="icon"]').href = tab;
    if (home) {
      const l = document.createElement('link');
      l.rel = 'apple-touch-icon';
      l.href = home;
      document.head.appendChild(l);
    }
  })('🀄', '#1f9a6a');
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --yellow: #ffd400;
    --gold: #f1c453;
    --red: #d8322a;
    --pink: #ff3d7f;
    --cyan: #18d4ff;
    --jade: #1f9a6a;
    --blue: #2f7cf0;
    --orange: #ff8a1f;
    --ink: #14121f;
    --display: 'Bungee', 'Arial Black', Impact, sans-serif;
    --pad: max(12px, env(safe-area-inset-left));
    /* the kit's ? and language buttons (js/keys.js): the middle of the left edge, but on a tall screen in a game the
       bottom left corner, and on a tall title the top left corner, so the tiles and the menu can use the whole width */
    --kh-top: calc(50% - 20px);
    --kl-top: calc(50% + 28px);
  }
  body[data-tall="1"][data-screen="play"] { --kh-top: calc(100% - 104px - env(safe-area-inset-bottom)); --kl-top: calc(100% - 56px - env(safe-area-inset-bottom)); }
  body[data-tall="1"][data-screen="home"] { --kh-top: max(10px, env(safe-area-inset-top)); --kl-top: calc(max(10px, env(safe-area-inset-top)) + 48px); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden; color: #fff;
    font-family: 'Rubik', system-ui, -apple-system, sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  /* the room: a warm apricot wall with little red "lucky" dots and soft gold rings */
  body {
    background:
      radial-gradient(circle, rgba(216, 50, 42, 0.16) 0 3px, transparent 4px) 0 0 / 52px 52px,
      radial-gradient(circle, transparent 0 11px, rgba(255, 255, 255, 0.35) 12px 14px, transparent 15px) 26px 26px / 52px 52px,
      linear-gradient(180deg, #ffe6b3, #ffcf86);
    background-color: #ffd88f;
  }
  #game, #fx { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #game { z-index: 2; }
  #fx { pointer-events: none; z-index: 8; }
  .hidden { opacity: 0 !important; pointer-events: none !important; visibility: hidden; }
  .gone { display: none !important; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }

  /* ---------- big chunky buttons ---------- */
  .bigbtn {
    min-width: clamp(78px, 13vmin, 112px); height: clamp(78px, 13vmin, 112px); border-radius: 28px; padding: 0 18px;
    font-size: clamp(40px, 7vmin, 58px); line-height: 1; display: flex; align-items: center; justify-content: center; gap: 10px;
    background: linear-gradient(160deg, #ffffff, #fff0d6); border: 5px solid #fff; box-shadow: 0 7px 0 var(--ink); color: var(--ink);
    transition: transform 0.08s;
  }
  .bigbtn.go { background: linear-gradient(160deg, #ff6a4d, #d8322a); color: #fff; text-shadow: 0 3px 0 rgba(0,0,0,.25); }
  .bigbtn .word { font-family: var(--display); font-size: clamp(22px, 4.4vmin, 36px); -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 0 3px 0 var(--ink); color: #fff; }
  .bigbtn .word.dark { color: var(--yellow); }
  .bigbtn:active, .seg button:active, .ibtn:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--ink); }
  .ibtn {
    width: clamp(52px, 8vmin, 72px); height: clamp(52px, 8vmin, 72px); border-radius: 20px; font-size: clamp(26px, 4.4vmin, 36px); line-height: 1;
    display: grid; place-items: center; background: rgba(255, 255, 255, 0.92); border: 4px solid #fff; box-shadow: 0 5px 0 var(--ink); color: var(--ink);
  }

  /* ---------- home ---------- */
  #home { position: fixed; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(8px, 1.8vh, 16px); transition: opacity 0.3s; padding: 12px; }
  body[data-tall="0"] #home { left: 48vw; right: max(10px, env(safe-area-inset-right)); top: 0; bottom: 0; }
  body[data-tall="1"] #home { left: 0; right: 0; bottom: max(8px, env(safe-area-inset-bottom)); height: 62vh; justify-content: flex-start; padding: 6px 10px; }
  .logo { text-align: center; font-family: var(--display); line-height: 0.92; transform: rotate(-3deg); }
  .logo small { display: block; font-size: clamp(26px, 5vmin, 44px); color: var(--jade); -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 0 4px 0 var(--ink); }
  .logo big { display: block; font-size: clamp(36px, 7.6vmin, 76px); color: var(--yellow); -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill; text-shadow: 0 6px 0 var(--red), 0 10px 0 var(--ink), 0 14px 24px rgba(0,0,0,.2); letter-spacing: 1px; white-space: nowrap; }
  .tagline { font-family: var(--display); font-size: clamp(13px, 2.3vmin, 19px); color: #fff; -webkit-text-stroke: 1.5px var(--ink); paint-order: stroke fill; text-align: center; margin-top: 2px; }
  .opts { display: flex; flex-direction: column; align-items: center; gap: clamp(7px, 1.4vh, 12px); }
  .seg { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .seg button {
    display: flex; align-items: center; gap: 7px; height: clamp(48px, 7.6vmin, 64px); padding: 0 14px 0 9px; border-radius: 20px; border: 4px solid #fff;
    background: rgba(255, 255, 255, 0.6); box-shadow: 0 5px 0 var(--ink); color: var(--ink); font-family: var(--display); font-size: clamp(13px, 2.5vmin, 21px); transition: transform 0.12s;
  }
  .seg button img { height: 80%; aspect-ratio: 1; border-radius: 14px; background: radial-gradient(circle at 50% 35%, #ffffff, #b9e6ff); }
  .seg button .emo { font-size: 1.35em; line-height: 1; display: grid; place-items: center; }
  .seg button.on { background: linear-gradient(160deg, #fffbe0, #ffd84a); border-color: var(--yellow); box-shadow: 0 0 0 4px var(--ink), 0 6px 0 4px var(--ink); transform: scale(1.06); }
  /* the tile sets: a big picture each, the name of the one you picked underneath */
  .seg.sets button { padding: 0; width: clamp(52px, 8.4vmin, 72px); justify-content: center; }
  .seg.sets button .emo { font-size: clamp(28px, 4.8vmin, 40px); }
  .setname { font-family: var(--display); font-size: clamp(13px, 2.2vmin, 18px); color: var(--ink); background: rgba(255,255,255,.7); padding: 2px 12px; border-radius: 999px; margin-top: -2px; }
  /* 1 player: which level to start on */
  .lvpick { display: flex; align-items: center; gap: 8px; font-family: var(--display); color: var(--ink); font-size: clamp(14px, 2.6vmin, 22px); background: rgba(255,255,255,.6); border: 4px solid #fff; border-radius: 22px; padding: 3px 6px; box-shadow: 0 5px 0 var(--ink); }
  .lvpick button { width: clamp(36px, 6vmin, 48px); height: clamp(36px, 6vmin, 48px); border-radius: 14px; background: #fff; box-shadow: 0 3px 0 var(--ink); font-size: clamp(16px, 3vmin, 24px); }
  .lvpick button:disabled { opacity: 0.3; }
  .lvpick span { min-width: 6.5em; text-align: center; }
  .duo { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-size: clamp(15px, 2.8vmin, 24px); color: var(--ink); background: rgba(255,255,255,.6); border: 4px solid #fff; border-radius: 22px; padding: 4px 14px 4px 6px; box-shadow: 0 5px 0 var(--ink); }
  .duo img { width: clamp(40px, 6.4vmin, 56px); aspect-ratio: 1; border-radius: 14px; background: radial-gradient(circle at 50% 35%, #ffffff, #b9e6ff); }
  .playrow { display: flex; align-items: center; gap: 14px; }
  #goPlay { min-width: clamp(170px, 30vmin, 260px); height: clamp(62px, 10vmin, 86px); font-size: clamp(30px, 5vmin, 44px); }
  #storyBtn { width: clamp(56px, 9vmin, 78px); height: clamp(56px, 9vmin, 78px); }
  @media (max-height: 520px) {
    /* a phone on its side: everything a size smaller so it all fits */
    #home { gap: 5px; padding: 4px 8px; }
    .logo small { font-size: 16px; -webkit-text-stroke-width: 2px; text-shadow: 0 2px 0 var(--ink); }
    .logo big { font-size: 28px; text-shadow: 0 3px 0 var(--red), 0 5px 0 var(--ink); -webkit-text-stroke-width: 3px; }
    .tagline { display: none; }
    .opts { gap: 6px; }
    .seg { gap: 5px; }
    .seg button { height: 38px; font-size: 12px; border-radius: 13px; padding: 0 8px 0 5px; border-width: 3px; box-shadow: 0 3px 0 var(--ink); }
    .seg button.on { box-shadow: 0 0 0 3px var(--ink), 0 4px 0 3px var(--ink); transform: none; }
    .seg.sets button { width: 44px; }
    .seg.sets button .emo { font-size: 24px; }
    .setname { display: none; }
    .lvpick { font-size: 12px; padding: 1px 4px; border-width: 3px; box-shadow: 0 3px 0 var(--ink); }
    .lvpick button { width: 30px; height: 30px; font-size: 14px; border-radius: 10px; }
    .duo { font-size: 13px; padding: 2px 10px 2px 4px; border-width: 3px; }
    .duo img { width: 32px; }
    #goPlay { height: 50px; min-width: 150px; font-size: 26px; border-radius: 20px; }
    #storyBtn { width: 50px; height: 50px; font-size: 24px; border-radius: 16px; }
  }
  @media (max-width: 430px) {
    /* a phone held upright: smaller buttons */
    .seg { gap: 6px; }
    .seg button { padding: 0 8px 0 5px; gap: 4px; font-size: 12px; height: 44px; border-radius: 15px; border-width: 3px; }
    .seg button .emo { font-size: 1.2em; }
    .seg.sets button { width: 52px; }
    .seg.sets button .emo { font-size: 28px; }
    .logo big { font-size: 34px; }
    .tagline { display: none; }
    #goPlay { height: 62px; }
  }
  @media (max-height: 780px) and (max-aspect-ratio: 115/100) {
    /* a shorter phone held upright: the menu a size smaller so the little board still shows above it */
    body[data-tall="1"] #home { height: 64vh; gap: 6px; }
    .logo small { font-size: 18px; }
    .logo big { font-size: 32px; }
    .tagline { display: none; }
    .seg button { height: 42px; border-radius: 15px; border-width: 3px; }
    .opts { gap: 7px; }
    .duo img { width: 36px; }
    #goPlay { height: 58px; }
  }

  /* ---------- HUD ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 6; transition: opacity 0.3s; }
  .hudtop { position: absolute; left: var(--pad); right: max(12px, env(safe-area-inset-right)); top: max(10px, env(safe-area-inset-top)); display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .hudtop button { pointer-events: auto; flex-shrink: 0; }
  .hudright { display: flex; gap: 10px; }
  .hudmid { display: flex; flex-direction: column; align-items: center; gap: 6px; flex: 1; min-width: 0; }
  .score { display: flex; align-items: center; gap: clamp(6px, 1.4vmin, 12px); padding: 5px 8px; border-radius: 999px; background: rgba(20, 18, 31, 0.62); border: 3px solid #fff; }
  .score .side { display: flex; align-items: center; gap: clamp(4px, 1vmin, 8px); border-radius: 999px; padding: 2px; }
  .score img { width: clamp(38px, 6.5vmin, 56px); height: clamp(38px, 6.5vmin, 56px); border-radius: 50%; background: radial-gradient(circle at 50% 35%, #fff3d0, #ffd27a); border: 4px solid var(--blue); }
  .score img.tommy { border-color: var(--orange); }
  .score img.cpu { border-color: var(--jade); background: radial-gradient(circle at 50% 35%, #ffffff, #e2ffe8); }
  .score b { font-family: var(--display); font-weight: 400; font-size: clamp(26px, 5vmin, 42px); line-height: 1; color: var(--yellow); min-width: 1ch; text-align: center; -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; font-variant-numeric: tabular-nums; }
  .score b.bump { animation: bump 0.45s cubic-bezier(.3, 1.8, .5, 1); }
  .score .dash { font-family: var(--display); color: #fff; font-size: clamp(18px, 3vmin, 26px); }
  .score .emoface { width: clamp(38px, 6.5vmin, 56px); height: clamp(38px, 6.5vmin, 56px); border-radius: 50%; display: grid; place-items: center; font-size: clamp(24px, 4.2vmin, 36px); background: radial-gradient(circle at 50% 35%, #ffffff, #e2ffe8); border: 4px solid var(--jade); }
  /* 1 player: the level, pairs left, score, best and (🔥 NORMAL) the clock */
  .score.solo { padding: 4px 12px 4px 5px; gap: clamp(8px, 2vmin, 16px); }
  .chip { display: flex; flex-direction: column; align-items: center; line-height: 1; }
  .chip small { font-family: var(--display); font-size: clamp(10px, 1.7vmin, 13px); color: #fff; opacity: 0.9; margin-top: 2px; }
  .chip b { font-size: clamp(22px, 4.2vmin, 36px); }
  .chip.lv b { color: #fff; }
  .chip.best b { color: #7df7c8; }
  .clock { width: clamp(160px, 34vmin, 320px); height: 16px; border-radius: 999px; background: rgba(20, 18, 31, 0.55); border: 3px solid #fff; overflow: hidden; }
  .clock i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #3fe0b0, #ffd400); border-radius: 999px; transition: width 0.25s linear; }
  .clock.low i { background: linear-gradient(90deg, #ff3d3d, #ff8a1f); }
  .clock.low { animation: nudge 0.6s ease-in-out infinite; }
  @keyframes bump { 40% { transform: scale(1.45) rotate(-6deg); } }
  @keyframes nudge { 50% { transform: scale(1.06); } }
  @media (max-width: 520px) {
    .score img, .score .emoface { width: 34px; height: 34px; border-width: 3px; font-size: 22px; }
    .chip b { font-size: 20px; }
    .chip small { font-size: 9px; }
    .score.solo { gap: 8px; padding: 3px 8px 3px 4px; }
    .score b { font-size: 24px; }
    .hudright { gap: 6px; }
    .ibtn { width: 48px; height: 48px; font-size: 24px; border-radius: 15px; border-width: 3px; }
  }
  @media (max-height: 520px) {
    /* a phone on its side: the clock beside the score, all smaller */
    .hudmid { flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 4px 10px; align-items: center; }
    .score img, .score .emoface { width: 30px; height: 30px; border-width: 3px; font-size: 20px; }
    .score b { font-size: 22px; }
    .chip b { font-size: 18px; }
    .chip small { font-size: 9px; }
    .clock { width: 120px; }
    .ibtn { width: 44px; height: 44px; font-size: 22px; border-radius: 14px; border-width: 3px; }
  }
  /* whose board is whose (the race): a name tag over each board */
  .btag { position: fixed; z-index: 6; pointer-events: none; display: flex; align-items: center; gap: 6px; font-family: var(--display); font-size: clamp(12px, 2.2vmin, 18px); color: #fff; -webkit-text-stroke: 1.5px var(--ink); paint-order: stroke fill; transform: translate(-50%, -100%); white-space: nowrap; }
  .btag img, .btag .emo { width: clamp(24px, 4vmin, 34px); height: clamp(24px, 4vmin, 34px); border-radius: 50%; background: #fff3d0; border: 3px solid var(--blue); display: grid; place-items: center; font-size: 0.95em; }
  .btag.tommy img { border-color: var(--orange); }
  .btag .emo { border-color: var(--jade); }

  /* your brother's button (1 player) / the high five (2 players): bottom right, big */
  .callbtn {
    position: fixed; z-index: 7; right: max(14px, env(safe-area-inset-right)); bottom: max(14px, env(safe-area-inset-bottom));
    width: clamp(84px, 14vmin, 124px); aspect-ratio: 1; border-radius: 50%; padding: 6px;
    background: linear-gradient(135deg, #ffb02e, #ff7a1a); border: 5px solid #fff; box-shadow: 0 7px 0 var(--ink);
    display: grid; place-items: center; font-size: clamp(44px, 8vmin, 64px); line-height: 1;
  }
  .callbtn img { width: 100%; height: 100%; border-radius: 50%; background: radial-gradient(circle at 50% 35%, #fff3d0, #ffd27a); }
  .callbtn #callEmoji:empty { display: none; }
  .callbtn kbd { position: absolute; left: -6px; top: -6px; width: 34px; height: 34px; border-radius: 10px; background: #fff; color: var(--ink); font: 400 18px/30px var(--display); text-align: center; border: 3px solid var(--ink); }
  @media (hover: none) and (pointer: coarse) { .callbtn kbd { display: none; } }
  .callbtn:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--ink); }
  .callbtn.here { animation: glow 1.1s ease-in-out infinite; border-color: var(--yellow); }
  @keyframes glow { 50% { box-shadow: 0 0 30px 8px rgba(255, 212, 0, 0.9), 0 7px 0 var(--ink); } }
  @media (max-height: 520px) { .callbtn { width: 70px; border-width: 4px; } }

  /* the race's count-in */
  #count { position: fixed; inset: 0; z-index: 9; display: grid; place-items: center; pointer-events: none; font-family: var(--display); font-size: clamp(80px, 22vmin, 200px); color: var(--yellow); -webkit-text-stroke: 6px var(--ink); paint-order: stroke fill; text-shadow: 0 8px 0 var(--red); }
  #count:empty { display: none; }
  #count span { animation: toast 0.9s ease-out forwards; }

  /* ---------- toasts ---------- */
  #toasts { position: fixed; left: 50%; top: 22%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; z-index: 9; width: 96vw; }
  .toast {
    font-family: var(--display); font-size: clamp(20px, 4vmin, 38px); color: var(--yellow); max-width: 94vw; text-align: center;
    -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 0 4px 0 var(--ink); animation: toast 1.9s ease-out forwards;
  }
  .toast.save { color: #7ff4ff; font-size: clamp(22px, 4.8vmin, 44px); animation-duration: 2.8s; }
  .toast.treat { color: #fff; }
  .toast.buddy { color: #ffb02e; }
  .toast.name { color: #fff; font-size: clamp(26px, 5.4vmin, 50px); animation-duration: 1.3s; }
  .toast.streak { color: #ff9be0; }
  .toast.nope { color: #ffb4a8; }
  .toast.shuffle { color: var(--cyan); }
  @keyframes toast { 0% { transform: scale(0.4); opacity: 0; } 12% { transform: scale(1.12); opacity: 1; } 20% { transform: scale(1); } 80% { opacity: 1; } 100% { transform: translateY(-30px); opacity: 0; } }

  /* ---------- overlays: the result, pause, the story ---------- */
  .overlay { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: rgba(20, 18, 31, 0.35); transition: opacity 0.25s; padding: 14px; }
  .panel { position: relative; display: flex; flex-direction: column; align-items: center; gap: clamp(8px, 1.8vh, 16px); padding: clamp(16px, 3.4vmin, 32px); border-radius: 40px; background: linear-gradient(170deg, #fffaf0, #ffe4b8); border: 6px solid #fff; box-shadow: 0 0 0 4px var(--red), 0 10px 0 4px var(--ink); color: var(--ink); max-width: 96vw; max-height: 96vh; }
  .rface { display: flex; align-items: center; gap: 14px; }
  .rface img, .rface .emoface { width: clamp(70px, 14vmin, 120px); aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 50% 35%, #fff3d0, #ffd27a); border: 5px solid var(--blue); box-shadow: 0 4px 0 var(--ink); animation: pop 0.5s cubic-bezier(.3, 1.8, .5, 1); }
  .rface img.tommy { border-color: var(--orange); }
  .rface .emoface { display: grid; place-items: center; font-size: clamp(44px, 9vmin, 76px); border-color: var(--jade); background: radial-gradient(circle at 50% 35%, #ffffff, #e2ffe8); }
  @keyframes pop { from { transform: scale(0.3); } }
  .rtitle { font-family: var(--display); font-size: clamp(28px, 6.2vmin, 56px); line-height: 1.05; text-align: center; color: var(--yellow); -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill; text-shadow: 0 5px 0 var(--ink); max-width: 88vw; }
  .rsub { display: flex; gap: 18px; font-family: var(--display); font-size: clamp(16px, 3.2vmin, 26px); text-align: center; color: var(--ink); flex-wrap: wrap; justify-content: center; }
  .rsub:empty { display: none; }
  .rbest { font-family: var(--display); font-size: clamp(13px, 2.4vmin, 19px); color: #7a5a3a; text-align: center; }
  .rbest:empty { display: none; }
  .rbest.new { color: #fff; background: var(--pink); padding: 4px 14px; border-radius: 999px; border: 3px solid var(--ink); font-size: clamp(16px, 3vmin, 24px); animation: nudge 1s ease-in-out infinite; }
  .rbtns { display: flex; gap: clamp(14px, 3vmin, 26px); align-items: center; flex-wrap: wrap; justify-content: center; }
  #pause .panel { flex-direction: row; gap: 20px; flex-wrap: wrap; justify-content: center; }
  @media (max-height: 430px) { .panel { gap: 6px; padding: 10px 20px; } .rface img, .rface .emoface { width: 56px; } .bigbtn { height: 58px; min-width: 58px; font-size: 28px; border-radius: 20px; } .rtitle { font-size: 26px; } }
  /* the story card */
  #story .panel { width: min(640px, 96vw); text-align: center; }
  .shead { font-family: var(--display); font-size: clamp(20px, 4.4vmin, 34px); color: var(--red); }
  .sart { font-size: clamp(48px, 11vmin, 92px); line-height: 1.1; letter-spacing: 6px; min-height: 1.1em; }
  .stext { font-size: clamp(16px, 3vmin, 23px); line-height: 1.45; font-weight: 700; max-width: 34em; min-height: 4.4em; }
  .sdots { display: flex; gap: 8px; }
  .sdots i { width: 12px; height: 12px; border-radius: 50%; background: #e7c9a0; border: 2px solid var(--ink); }
  .sdots i.on { background: var(--red); }
  @media (max-height: 430px) { .sart { font-size: 40px; } .stext { font-size: 14px; min-height: 0; } .shead { font-size: 18px; } }

  #loading { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: #ffd88f; font-size: 80px; transition: opacity 0.4s; }
  #loading span { animation: bump 0.8s infinite; display: inline-block; }
  @media (prefers-reduced-motion: reduce) { .callbtn.here, .rbest.new, .clock.low { animation: none; } }
</style>
</head>
<body data-screen="boot" data-tall="0">
<canvas id="game"></canvas>
<canvas id="fx"></canvas>

<!-- home -->
<div id="home" class="hidden">
  <div class="logo" id="logo"><small></small><big></big></div>
  <div class="tagline" id="tagline">MATCH TWO TILES. JOIN THEM WITH TWO TURNS OR LESS!</div>
  <div class="opts">
    <div class="seg" id="segMode" role="radiogroup" aria-label="Who plays">
      <button data-v="solo" title="1 player (1)"><span class="emo">👤</span>1 PLAYER</button>
      <button data-v="race" title="Race a friend (2)"><span class="emo" id="raceEmo">🐸</span><span id="raceWord">RACE FROGGY</span></button>
      <button data-v="two" title="2 players (3)"><span class="emo">👥</span>2 PLAYERS</button>
    </div>
    <div class="seg" id="segWho" role="radiogroup" aria-label="Who are you?">
      <button data-v="teddy" title="Teddy (W)"><img alt="" draggable="false">TEDDY</button>
      <button data-v="tommy" title="Tommy (W)"><img alt="" draggable="false">TOMMY</button>
    </div>
    <div class="duo" id="duo" style="display:none"><img id="duoA" alt="" draggable="false">TEDDY & TOMMY<img id="duoB" alt="" draggable="false"></div>
    <div class="seg" id="segLevel" role="radiogroup" aria-label="Level">
      <button data-v="easy" title="Easy (L)"><span class="emo">🐣</span>EASY</button>
      <button data-v="normal" title="Normal (L)"><span class="emo">🔥</span>NORMAL</button>
    </div>
    <div class="seg sets" id="segSet" role="radiogroup" aria-label="Tiles">
      <button data-v="zodiac" title="Zodiac animals" aria-label="Zodiac animals"><span class="emo">🐲</span></button>
      <button data-v="china" title="China" aria-label="China"><span class="emo">🏮</span></button>
      <button data-v="fruit" title="Fruit" aria-label="Fruit"><span class="emo">🍓</span></button>
      <button data-v="animals" title="Animals" aria-label="Animals"><span class="emo">🐼</span></button>
    </div>
    <div class="setname" id="setName"></div>
    <div class="lvpick" id="lvPick">
      <button id="lvDown" aria-label="An easier level">◀</button>
      <span id="lvWord">LEVEL 1</span>
      <button id="lvUp" aria-label="A harder level">▶</button>
    </div>
  </div>
  <div class="playrow">
    <button class="ibtn" id="storyBtn" title="The story (B)" aria-label="The story">📜</button>
    <button class="bigbtn go" id="goPlay" title="Play (Enter)" aria-label="Play"><span class="word">PLAY</span>▶</button>
  </div>
</div>

<!-- HUD -->
<div id="hud" class="hidden">
  <div class="hudtop">
    <button class="ibtn" id="pauseBtn" title="Pause (P)" aria-label="Pause">⏸️</button>
    <div class="hudmid">
      <div class="score solo" id="score1">
        <img id="face1" alt="">
        <div class="chip lv"><b id="lv1">1</b><small>LEVEL</small></div>
        <div class="chip"><b id="left1">0</b><small>PAIRS LEFT</small></div>
        <div class="chip"><b id="pts1">0</b><small>SCORE</small></div>
        <div class="chip best" id="bestBox"><b id="best1">0</b><small>BEST</small></div>
      </div>
      <div class="score gone" id="score2">
        <div class="side" id="sideL"><img id="faceL" alt=""><b id="scoreL">0</b></div>
        <span class="dash">–</span>
        <div class="side" id="sideR"><b id="scoreR">0</b><img id="faceR" alt=""></div>
      </div>
      <div class="clock gone" id="clock"><i id="clockBar"></i></div>
    </div>
    <div class="hudright">
      <button class="ibtn" id="shuffleBtn" title="Shuffle (X)" aria-label="Shuffle the tiles">🔀</button>
      <button class="ibtn" id="muteBtn" title="Sound (M)" aria-label="Sound on or off">🔊</button>
    </div>
  </div>
</div>
<div class="btag gone" id="tag0"><img id="tagFace0" alt=""><span id="tagName0"></span></div>
<div class="btag gone" id="tag1"><img id="tagFace1" alt=""><span id="tagName1"></span></div>
<button class="callbtn hidden" id="callBtn" aria-label="Call your brother" title="Call your brother (T)"><img id="callFace" alt=""><span id="callEmoji"></span><kbd>T</kbd></button>

<div id="count"></div>
<div id="toasts"></div>

<!-- the level is clear / the race is over / the clock ran out -->
<div id="gameOver" class="overlay hidden">
  <div class="panel">
    <div class="rface" id="oFace"></div>
    <div class="rtitle" id="oTitle"></div>
    <div class="rsub" id="oSub"></div>
    <div class="rbest" id="oBest"></div>
    <div class="rbtns">
      <button class="bigbtn go" id="oNext" aria-label="Next level"><span class="word">NEXT LEVEL</span></button>
      <button class="bigbtn go" id="oAgain" aria-label="Play again"><span class="word">PLAY AGAIN</span></button>
      <button class="bigbtn" id="oHome" aria-label="Home">🏠</button>
    </div>
  </div>
</div>

<!-- pause -->
<div id="pause" class="overlay hidden">
  <div class="panel">
    <button class="bigbtn go" id="pResume" aria-label="Keep playing">▶</button>
    <button class="bigbtn" id="pRestart" aria-label="Start again">🔄</button>
    <button class="bigbtn" id="pHome" aria-label="Home">🏠</button>
  </div>
</div>

<!-- the story -->
<div id="story" class="overlay hidden">
  <div class="panel">
    <div class="shead" id="sHead">TILES FROM CHINA</div>
    <div class="sart" id="sArt"></div>
    <div class="stext" id="sText"></div>
    <div class="sdots" id="sDots"></div>
    <div class="rbtns">
      <button class="ibtn" id="sPrev" aria-label="Back a page">◀</button>
      <button class="ibtn" id="sNext" aria-label="Next page">▶</button>
      <button class="ibtn" id="sClose" aria-label="Close the story">✖</button>
    </div>
  </div>
</div>

<div id="loading"><span>🀄</span></div>
